<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de Lista</title>
</head>
<body>
    <h1>Elementos de lista</h1>
    <p>
        As listas em HTML são utilizadas para organizar informações em uma sequência.
    </p>
    <h2>Listas ordenadas</h2>
    <ol>
        <li>planejar as pistas A</li>
        <li>planejar as pistas B</li>
        <li>decidir o fim da investigação</li>
    </ol>
    <h2>Listas Não Ordenadas</h2>
    <ul>
        <li>item um</li>
        <li>item dois</li>
        <li>item três</li>
        <li>item quatro</li>
        <li>item cinco</li>
    </ul>
</body>
</html>
