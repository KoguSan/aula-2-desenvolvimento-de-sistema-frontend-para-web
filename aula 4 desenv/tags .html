<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de link</title>
</head>
<body>
    <h1>
        exemplo de link e imagem
    </h1>
    <br/>
    <h2>link externo</h2>
    <p>
        Acesse o site por meio do link
    </p>

    <a
        href="https://google.com"
        target="_blank"
        rel="noopener noreferrer"
    >
        Visitar o site da Google
    </a>
    <br/>
    <h2>
        imagem do projeto
    </h2>
    <br/>
    <img
        src="img/baixados.webp"
        alt="foto do front-end"
        width="300"
    />

</body>
</html>
