<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo div com css</title>

    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 20px;
        }
        #principal{
            background-color:cadetblue;
            border: 3px solid blue;
            color: white;
        }
        #secundaria{
            background-color:cornsilk;
            border: 4px solid green;
            color: black;
        }
        hr{
            border: antiquewhite;
            border-top: 3px solid red;
            width: 80%;
        }
    </style>
</head>
<body>
    <div id="principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
    </div>
    <hr/>
    <div id="secundaria">
        Esta é outra divisão da página.
        <br>
        Aqui começa uma nova linha.
    </div>
</body>
</html>
